<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 24px;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .refresh-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .refresh-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>Conversation History</header>
    <div class="container">
        <button class="refresh-button" onclick="loadConversations()">Refresh Conversations</button>
        <table id="conversationTable">
            <thead>
                <tr>
                    <th>User Message</th>
                    <th>Bot Response</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="conversationBody">
                <!-- Conversations will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        function loadConversations() {
            fetch('/conversations')
                .then(response => response.json())
                .then(data => {
                    const conversationBody = document.getElementById('conversationBody');
                    conversationBody.innerHTML = '';  // Clear table before inserting new data
                    data.forEach(conversation => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${conversation.user_message}</td>
                            <td>${conversation.bot_response}</td>
                            <td>${conversation.timestamp}</td>
                        `;
                        conversationBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        // Automatically load conversations when the page loads
        window.onload = loadConversations;
    </script>
</body>
</html>
